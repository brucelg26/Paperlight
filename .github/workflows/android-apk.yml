name: Build Paperlight APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install required SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bundle PDF.js into APK for offline reading
        run: |
          npm install --no-save --no-package-lock --ignore-scripts pdfjs-dist@5.4.149
          cp node_modules/pdfjs-dist/build/pdf.min.mjs app/src/main/assets/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs app/src/main/assets/pdf.worker.min.js
          test -s app/src/main/assets/pdf.min.js
          test -s app/src/main/assets/pdf.worker.min.js

      - name: Build Android APK
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Paperlight-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
